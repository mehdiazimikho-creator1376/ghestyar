name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p ghestyar/app
          cat > ghestyar/app/build.gradle <<'GHEOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ghestyar.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ghestyar.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          GHEOF
          mkdir -p ghestyar/app/src/main
          cat > ghestyar/app/src/main/AndroidManifest.xml <<'GHEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
              <application
                  android:label="قسط‌یار"
                  android:supportsRtl="true"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AlarmReceiver" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          GHEOF
          mkdir -p ghestyar/app/src/main/java/com/ghestyar/app
          cat > ghestyar/app/src/main/java/com/ghestyar/app/AlarmReceiver.java <<'GHEOF'
          package com.ghestyar.app;

          import android.content.*;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context c, Intent i) {
                  Core.notify(c, i.getIntExtra("code", 0), i.getStringExtra("msg"));
              }
          }
          GHEOF
          mkdir -p ghestyar/app/src/main/java/com/ghestyar/app
          cat > ghestyar/app/src/main/java/com/ghestyar/app/BootReceiver.java <<'GHEOF'
          package com.ghestyar.app;

          import android.content.*;

          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context c, Intent i) {
                  Core.schedule(c, Core.load(c));
              }
          }
          GHEOF
          mkdir -p ghestyar/app/src/main/java/com/ghestyar/app
          cat > ghestyar/app/src/main/java/com/ghestyar/app/Core.java <<'GHEOF'
          package com.ghestyar.app;

          import android.app.*;
          import android.content.*;
          import org.json.*;
          import java.util.*;

          public final class Core {
              static final String CH = "ghesty";
              static final String[] MONTHS = {"فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"};

              static class Loan {
                  int id, remaining, paid, day, y, m;
                  long amount;
                  String bank;
                  int[] due() { return new int[]{y, m, Math.min(day, jlen(y, m))}; }
                  JSONObject json() throws JSONException {
                      JSONObject o = new JSONObject();
                      o.put("id", id).put("bank", bank).put("amount", amount).put("remaining", remaining)
                       .put("paid", paid).put("day", day).put("y", y).put("m", m);
                      return o;
                  }
                  static Loan from(JSONObject o) throws JSONException {
                      Loan l = new Loan();
                      l.id = o.optInt("id"); l.bank = o.getString("bank"); l.amount = o.getLong("amount");
                      l.remaining = o.getInt("remaining"); l.paid = o.optInt("paid"); l.day = o.getInt("day");
                      l.y = o.getInt("y"); l.m = o.getInt("m");
                      if (l.m < 1 || l.m > 12 || l.day < 1 || l.day > 31 || l.amount <= 0 || l.remaining < 0)
                          throw new JSONException("bad");
                      return l;
                  }
              }

              // ---------- تقویم شمسی ----------
              static int[] g2j(int gy, int gm, int gd) {
                  int[] gdm = {0,31,59,90,120,151,181,212,243,273,304,334};
                  int gy2 = gm > 2 ? gy + 1 : gy;
                  int days = 355666 + 365 * gy + (gy2 + 3) / 4 - (gy2 + 99) / 100 + (gy2 + 399) / 400 + gd + gdm[gm - 1];
                  int jy = -1595 + 33 * (days / 12053);
                  days %= 12053;
                  jy += 4 * (days / 1461);
                  days %= 1461;
                  if (days > 365) { jy += (days - 1) / 365; days = (days - 1) % 365; }
                  int jm = days < 186 ? 1 + days / 31 : 7 + (days - 186) / 30;
                  int jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
                  return new int[]{jy, jm, jd};
              }

              static int[] j2g(int jy, int jm, int jd) {
                  jy += 1595;
                  int days = -355668 + 365 * jy + (jy / 33) * 8 + ((jy % 33) + 3) / 4 + jd
                          + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
                  int gy = 400 * (days / 146097);
                  days %= 146097;
                  if (days > 36524) {
                      gy += 100 * (--days / 36524);
                      days %= 36524;
                      if (days >= 365) days++;
                  }
                  gy += 4 * (days / 1461);
                  days %= 1461;
                  if (days > 365) { gy += (days - 1) / 365; days = (days - 1) % 365; }
                  int gd = days + 1;
                  int[] sa = {0,31,((gy % 4 == 0 && gy % 100 != 0) || gy % 400 == 0) ? 29 : 28,31,30,31,30,31,31,30,31,30,31};
                  int gm = 0;
                  while (gm < 13 && gd > sa[gm]) { gd -= sa[gm]; gm++; }
                  return new int[]{gy, gm, gd};
              }

              static int jlen(int y, int m) {
                  if (m <= 6) return 31;
                  if (m <= 11) return 30;
                  int[] g = j2g(y, 12, 30);
                  int[] j = g2j(g[0], g[1], g[2]);
                  return (j[0] == y && j[1] == 12 && j[2] == 30) ? 30 : 29;
              }

              static int[] today() {
                  Calendar c = Calendar.getInstance();
                  return g2j(c.get(Calendar.YEAR), c.get(Calendar.MONTH) + 1, c.get(Calendar.DAY_OF_MONTH));
              }

              static int daysLeft(Loan x) {
                  int[] d = x.due(), g = j2g(d[0], d[1], d[2]);
                  Calendar a = Calendar.getInstance();
                  a.set(g[0], g[1] - 1, g[2], 0, 0, 0); a.set(Calendar.MILLISECOND, 0);
                  Calendar b = Calendar.getInstance();
                  b.set(Calendar.HOUR_OF_DAY, 0); b.set(Calendar.MINUTE, 0); b.set(Calendar.SECOND, 0); b.set(Calendar.MILLISECOND, 0);
                  return (int) Math.round((a.getTimeInMillis() - b.getTimeInMillis()) / 86400000.0);
              }

              // ---------- قالب‌بندی ----------
              static String fa(String s) {
                  StringBuilder b = new StringBuilder();
                  for (char c : s.toCharArray()) b.append(c >= '0' && c <= '9' ? (char) ('۰' + (c - '0')) : c);
                  return b.toString();
              }
              static String money(long v) { return fa(String.format(Locale.US, "%,d", v).replace(',', '٬')); }
              static String dateStr(int[] d) { return fa("" + d[2]) + " " + MONTHS[d[1] - 1] + " " + fa("" + d[0]); }
              static long num(String s) {
                  StringBuilder b = new StringBuilder();
                  for (char c : s.toCharArray()) {
                      if (c >= '۰' && c <= '۹') b.append((char) ('0' + c - '۰'));
                      else if (c >= '٠' && c <= '٩') b.append((char) ('0' + c - '٠'));
                      else if (c >= '0' && c <= '9') b.append(c);
                  }
                  if (b.length() == 0 || b.length() > 12) return -1;
                  return Long.parseLong(b.toString());
              }

              // ---------- ذخیره‌سازی ----------
              static SharedPreferences sp(Context c) { return c.getSharedPreferences("d", 0); }

              static List<Loan> load(Context c) {
                  List<Loan> l = new ArrayList<>();
                  try {
                      l = parse(sp(c).getString("loans", "[]"));
                  } catch (Exception e) { }
                  return l;
              }
              static List<Loan> parse(String s) throws Exception {
                  JSONArray a = new JSONArray(s);
                  List<Loan> l = new ArrayList<>();
                  for (int i = 0; i < a.length(); i++) l.add(Loan.from(a.getJSONObject(i)));
                  return l;
              }
              static String toJson(List<Loan> l) {
                  JSONArray a = new JSONArray();
                  try { for (Loan x : l) a.put(x.json()); } catch (Exception e) { }
                  return a.toString();
              }
              static int nextId(Context c) {
                  int n = sp(c).getInt("n", 1);
                  sp(c).edit().putInt("n", n + 1).apply();
                  return n;
              }
              static void save(Context c, List<Loan> l) {
                  for (Loan o : load(c)) cancel(c, o.id);
                  sp(c).edit().putString("loans", toJson(l)).apply();
                  schedule(c, l);
              }

              // ---------- یادآوری ----------
              static PendingIntent pi(Context c, int code, String msg) {
                  Intent i = new Intent(c, AlarmReceiver.class);
                  i.putExtra("msg", msg);
                  i.putExtra("code", code);
                  return PendingIntent.getBroadcast(c, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }
              static void cancel(Context c, int id) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  for (int k = 0; k < 2; k++) am.cancel(pi(c, id * 2 + k, ""));
              }
              static void schedule(Context c, List<Loan> l) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  for (Loan x : l) {
                      if (x.remaining <= 0) continue;
                      int[] d = x.due(), g = j2g(d[0], d[1], d[2]);
                      for (int k = 0; k < 2; k++) {
                          Calendar t = Calendar.getInstance();
                          t.set(g[0], g[1] - 1, g[2], 9, 0, 0);
                          t.set(Calendar.MILLISECOND, 0);
                          if (k == 0) t.add(Calendar.DAY_OF_MONTH, -3);
                          if (t.getTimeInMillis() <= System.currentTimeMillis()) continue;
                          String msg = k == 0
                                  ? "سه روز دیگر سررسید قسط وام " + x.bank + " به مبلغ " + money(x.amount) + " تومان است."
                                  : "امروز سررسید قسط وام " + x.bank + " به مبلغ " + money(x.amount) + " تومان است.";
                          PendingIntent p = pi(c, x.id * 2 + k, msg);
                          try {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t.getTimeInMillis(), p);
                          } catch (SecurityException e) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t.getTimeInMillis(), p);
                          }
                      }
                  }
              }
              static void notify(Context c, int code, String msg) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(CH, "یادآوری اقساط", NotificationManager.IMPORTANCE_HIGH));
                  PendingIntent op = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(c, CH)
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle("قسط‌یار")
                          .setContentText(msg)
                          .setStyle(new Notification.BigTextStyle().bigText(msg))
                          .setContentIntent(op)
                          .setAutoCancel(true)
                          .build();
                  nm.notify(code, n);
              }
          }
          GHEOF
          mkdir -p ghestyar/app/src/main/java/com/ghestyar/app
          cat > ghestyar/app/src/main/java/com/ghestyar/app/MainActivity.java <<'GHEOF'
          package com.ghestyar.app;

          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.*;
          import android.text.InputType;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.util.*;
          import com.ghestyar.app.Core.Loan;

          public class MainActivity extends Activity {
              LinearLayout root;
              static final int BLUE = 0xFF1565C0, GREEN = 0xFF2E7D32, RED = 0xFFC62828, GRAY = 0xFF546E7A, ORANGE = 0xFFEF6C00;

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }
              void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_LONG).show(); }

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(0xFFF4F6F8);
                  sv.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(28), dp(16), dp(24));
                  sv.addView(root);
                  setContentView(sv);
              }

              @Override protected void onResume() {
                  super.onResume();
                  Core.schedule(this, Core.load(this));
                  refresh();
              }

              // ---------- ابزارهای رابط ----------
              TextView t(String s, int sp, int col, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s); v.setTextSize(sp); v.setTextColor(col);
                  if (bold) v.setTypeface(null, Typeface.BOLD);
                  v.setPadding(0, dp(2), 0, dp(2));
                  return v;
              }
              Button btn(String s, int col, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(s); b.setTextColor(Color.WHITE); b.setAllCaps(false);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(col); g.setCornerRadius(dp(10));
                  b.setBackground(g);
                  b.setOnClickListener(l);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, dp(46), 1);
                  p.setMargins(dp(4), dp(8), dp(4), 0);
                  b.setLayoutParams(p);
                  return b;
              }
              LinearLayout card(int bg) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(bg); g.setCornerRadius(dp(16));
                  c.setBackground(g);
                  c.setPadding(dp(16), dp(12), dp(16), dp(12));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                  p.setMargins(0, dp(8), 0, dp(4));
                  c.setLayoutParams(p);
                  return c;
              }
              LinearLayout row() {
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.HORIZONTAL);
                  r.setLayoutParams(new LinearLayout.LayoutParams(-1, -2));
                  return r;
              }
              EditText et(String hint, boolean num) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setInputType(num ? InputType.TYPE_CLASS_NUMBER : InputType.TYPE_CLASS_TEXT);
                  e.setSingleLine(true);
                  return e;
              }

              // ---------- صفحه اصلی ----------
              void refresh() {
                  root.removeAllViews();
                  List<Loan> L = Core.load(this);
                  int[] now = Core.today();
                  long debt = 0, month = 0;
                  int cnt = 0;
                  for (Loan x : L) {
                      debt += x.amount * x.remaining;
                      if (x.remaining > 0 && (x.y < now[0] || (x.y == now[0] && x.m <= now[1]))) { month += x.amount; cnt++; }
                  }
                  root.addView(t("قسط‌یار", 26, BLUE, true));
                  LinearLayout s = card(BLUE);
                  s.addView(t("مجموع بدهی: " + Core.money(debt) + " تومان", 18, Color.WHITE, true));
                  s.addView(t("اقساط ماه جاری: " + Core.money(month) + " تومان (" + Core.fa("" + cnt) + " قسط)", 15, Color.WHITE, false));
                  s.addView(t("شامل اقساط عقب‌افتاده · امروز: " + Core.dateStr(now), 12, 0xFFBBDEFB, false));
                  root.addView(s);

                  LinearLayout r = row();
                  r.addView(btn("+ وام جدید", GREEN, v -> dialog(null)));
                  r.addView(btn("پشتیبان‌گیری", GRAY, v -> backup()));
                  r.addView(btn("بازیابی", GRAY, v -> restore()));
                  root.addView(r);

                  if (L.isEmpty()) {
                      TextView e = t("هنوز وامی ثبت نکرده‌اید.\nبا دکمه «وام جدید» شروع کنید.", 15, GRAY, false);
                      e.setPadding(0, dp(40), 0, 0);
                      e.setGravity(Gravity.CENTER);
                      root.addView(e);
                      return;
                  }
                  Collections.sort(L, (a, b) -> Long.compare(a.y * 10000L + a.m * 100L + a.day, b.y * 10000L + b.m * 100L + b.day));
                  for (final Loan x : L) {
                      LinearLayout c = card(Color.WHITE);
                      c.addView(t(x.bank, 19, Color.BLACK, true));
                      c.addView(t("مبلغ هر قسط: " + Core.money(x.amount) + " تومان", 15, 0xFF263238, false));
                      if (x.remaining > 0) {
                          int d = Core.daysLeft(x);
                          String when = d > 0 ? Core.fa("" + d) + " روز دیگر" : d == 0 ? "امروز" : Core.fa("" + (-d)) + " روز گذشته";
                          c.addView(t("سررسید بعدی: " + Core.dateStr(x.due()) + " (" + when + ")", 15, d < 0 ? RED : d <= 3 ? ORANGE : GRAY, d <= 3));
                      } else {
                          c.addView(t("✓ تسویه شد", 15, GREEN, true));
                      }
                      c.addView(t("اقساط باقی‌مانده: " + Core.fa("" + x.remaining) + " از " + Core.fa("" + (x.remaining + x.paid))
                              + " · پرداخت‌شده: " + Core.fa("" + x.paid), 14, GRAY, false));
                      c.addView(t("بدهی باقی‌مانده: " + Core.money(x.amount * x.remaining) + " تومان", 14, GRAY, false));
                      LinearLayout br = row();
                      if (x.remaining > 0) br.addView(btn("پرداخت شد", GREEN, v -> pay(x)));
                      br.addView(btn("ویرایش", BLUE, v -> dialog(x)));
                      br.addView(btn("حذف", RED, v -> del(x)));
                      c.addView(br);
                      root.addView(c);
                  }
              }

              void pay(final Loan x) {
                  new AlertDialog.Builder(this).setMessage("پرداخت یک قسط وام «" + x.bank + "» ثبت شود؟")
                          .setPositiveButton("بله", (d, w) -> {
                              List<Loan> L = Core.load(this);
                              for (Loan o : L) {
                                  if (o.id == x.id && o.remaining > 0) {
                                      o.remaining--; o.paid++;
                                      if (++o.m > 12) { o.m = 1; o.y++; }
                                  }
                              }
                              Core.save(this, L);
                              refresh();
                          }).setNegativeButton("خیر", null).show();
              }

              void del(final Loan x) {
                  new AlertDialog.Builder(this).setMessage("وام «" + x.bank + "» حذف شود؟")
                          .setPositiveButton("حذف", (d, w) -> {
                              List<Loan> L = Core.load(this);
                              L.removeIf(o -> o.id == x.id);
                              Core.save(this, L);
                              refresh();
                          }).setNegativeButton("انصراف", null).show();
              }

              void dialog(final Loan ex) {
                  final boolean add = ex == null;
                  int[] td = Core.today();
                  LinearLayout f = new LinearLayout(this);
                  f.setOrientation(LinearLayout.VERTICAL);
                  f.setPadding(dp(20), dp(8), dp(20), dp(8));
                  f.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  final EditText bank = et("نام بانک", false), amt = et("مبلغ هر قسط (تومان)", true), rem = et("تعداد اقساط باقی‌مانده", true);
                  final EditText yy = et("سال", true), mm = et("ماه", true), dd = et("روز", true);
                  if (add) {
                      yy.setText(String.valueOf(td[0])); mm.setText(String.valueOf(td[1])); dd.setText(String.valueOf(td[2]));
                  } else {
                      bank.setText(ex.bank); amt.setText(String.valueOf(ex.amount)); rem.setText(String.valueOf(ex.remaining));
                      yy.setText(String.valueOf(ex.y)); mm.setText(String.valueOf(ex.m)); dd.setText(String.valueOf(ex.day));
                  }
                  f.addView(bank); f.addView(amt); f.addView(rem);
                  f.addView(t("تاریخ سررسید قسط بعدی (شمسی)", 13, GRAY, false));
                  LinearLayout dr = row();
                  dr.addView(yy, new LinearLayout.LayoutParams(0, -2, 1.3f));
                  dr.addView(mm, new LinearLayout.LayoutParams(0, -2, 1));
                  dr.addView(dd, new LinearLayout.LayoutParams(0, -2, 1));
                  f.addView(dr);
                  ScrollView sv = new ScrollView(this);
                  sv.addView(f);
                  final AlertDialog d = new AlertDialog.Builder(this).setTitle(add ? "افزودن وام" : "ویرایش وام")
                          .setView(sv).setPositiveButton("ذخیره", null).setNegativeButton("انصراف", null).create();
                  d.show();
                  d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v -> {
                      String bn = bank.getText().toString().trim();
                      long A = Core.num(amt.getText().toString()), R = Core.num(rem.getText().toString());
                      long Y = Core.num(yy.getText().toString()), M = Core.num(mm.getText().toString()), D = Core.num(dd.getText().toString());
                      if (bn.isEmpty() || A <= 0 || R < (add ? 1 : 0) || Y < 1300 || Y > 1500 || M < 1 || M > 12 || D < 1 || D > 31) {
                          toast("لطفاً همه فیلدها را درست پر کنید (تاریخ شمسی، مثلاً ۱۴۰۵ / ۸ / ۲۵)");
                          return;
                      }
                      List<Loan> L = Core.load(this);
                      Loan x = null;
                      if (add) { x = new Loan(); x.id = Core.nextId(this); L.add(x); }
                      else for (Loan o : L) if (o.id == ex.id) x = o;
                      if (x == null) { d.dismiss(); return; }
                      x.bank = bn; x.amount = A; x.remaining = (int) R;
                      x.y = (int) Y; x.m = (int) M; x.day = (int) D;
                      Core.save(this, L);
                      d.dismiss();
                      refresh();
                  });
              }

              // ---------- پشتیبان‌گیری ----------
              void backup() {
                  Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("application/json");
                  i.putExtra(Intent.EXTRA_TITLE, "ghestyar-backup.json");
                  startActivityForResult(i, 11);
              }
              void restore() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  startActivityForResult(i, 12);
              }

              @Override protected void onActivityResult(int rc, int res, Intent data) {
                  super.onActivityResult(rc, res, data);
                  if (res != RESULT_OK || data == null || data.getData() == null) return;
                  Uri u = data.getData();
                  try {
                      if (rc == 11) {
                          OutputStream o = getContentResolver().openOutputStream(u);
                          o.write(Core.toJson(Core.load(this)).getBytes("UTF-8"));
                          o.close();
                          toast("نسخه پشتیبان ذخیره شد ✓");
                      } else if (rc == 12) {
                          InputStream in = getContentResolver().openInputStream(u);
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[4096];
                          int k;
                          while ((k = in.read(buf)) > 0) bo.write(buf, 0, k);
                          in.close();
                          final List<Loan> nl = Core.parse(bo.toString("UTF-8"));
                          new AlertDialog.Builder(this)
                                  .setMessage("اطلاعات فعلی با اطلاعات فایل (" + Core.fa("" + nl.size()) + " وام) جایگزین شود؟")
                                  .setPositiveButton("جایگزین کن", (d, w) -> {
                                      for (Loan x : nl) x.id = Core.nextId(this);
                                      Core.save(this, nl);
                                      refresh();
                                      toast("اطلاعات بازیابی شد ✓");
                                  }).setNegativeButton("انصراف", null).show();
                      }
                  } catch (Exception e) {
                      toast("فایل نامعتبر است یا خطایی رخ داد");
                  }
              }
          }
          GHEOF
          cat > ghestyar/build.gradle <<'GHEOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          GHEOF
          cat > ghestyar/gradle.properties <<'GHEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          GHEOF
          cat > ghestyar/settings.gradle <<'GHEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Ghestyar'
          include ':app'
          GHEOF
      - name: Build APK
        working-directory: ghestyar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ghestyar-APK
          path: ghestyar/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp ghestyar/app/build/outputs/apk/debug/app-debug.apk Ghestyar.apk
          gh release create "v${{ github.run_number }}" Ghestyar.apk --title "Ghestyar v${{ github.run_number }}" --notes "APK"
