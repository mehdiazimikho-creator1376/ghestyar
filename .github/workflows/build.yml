name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate project
        run: |
          mkdir -p ghestyar/app/src/main/java/com/ghestyar/app
          cat > ghestyar/app/build.gradle <<'GHEOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ghestyar.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.ghestyar.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          GHEOF
          cat > ghestyar/app/src/main/AndroidManifest.xml <<'GHEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <application
                  android:label="قسط‌یار"
                  android:supportsRtl="true"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AlarmReceiver" android:exported="false"/>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          GHEOF
          cat > ghestyar/app/src/main/java/com/ghestyar/app/AlarmReceiver.java <<'GHEOF'
          package com.ghestyar.app;
          import android.content.*;
          public class AlarmReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context c, Intent i) {
                  int id=i.getIntExtra("id",0);
                  Core.notifyUser(c,id,i.getStringExtra("message"));
                  Core.scheduleAll(c);
              }
          }
          GHEOF
          cat > ghestyar/app/src/main/java/com/ghestyar/app/BootReceiver.java <<'GHEOF'
          package com.ghestyar.app;
          import android.content.*;
          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context c, Intent i) {
                  Core.scheduleAll(c);
              }
          }
          GHEOF
          cat > ghestyar/app/src/main/java/com/ghestyar/app/Core.java <<'GHEOF'
          package com.ghestyar.app;
          import android.app.*;
          import android.content.*;
          import org.json.*;
          import java.util.*;
          public final class Core {
              static final String CHANNEL="ghestyar_reminders";
              static class Bill {
                  int id,day;
                  long amount;
                  String title,paidKey="";
                  JSONArray history=new JSONArray();
                  JSONObject json() throws JSONException {
                      JSONObject o=new JSONObject();
                      o.put("id",id).put("day",day).put("amount",amount)
                       .put("title",title).put("history",history).put("paidKey",paidKey);
                      return o;
                  }
                  static Bill from(JSONObject o) throws JSONException {
                      Bill b=new Bill();
                      b.id=o.getInt("id");
                      b.day=o.getInt("day");
                      b.amount=o.getLong("amount");
                      b.title=o.getString("title");
                      b.history=o.optJSONArray("history");
                      if(b.history==null)b.history=new JSONArray();
                      b.paidKey=o.optString("paidKey","");
                      return b;
                  }
              }
              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences("simple_bills",0);
              }
              static List<Bill> load(Context c) {
                  List<Bill> a=new ArrayList<>();
                  try {
                      JSONArray j=new JSONArray(prefs(c).getString("bills","[]"));
                      for(int i=0;i<j.length();i++)a.add(Bill.from(j.getJSONObject(i)));
                  } catch(Exception ignored) {}
                  return a;
              }
              static void save(Context c,List<Bill> a) {
                  JSONArray j=new JSONArray();
                  try { for(Bill b:a)j.put(b.json()); } catch(Exception ignored) {}
                  prefs(c).edit().putString("bills",j.toString()).apply();
                  scheduleAll(c);
              }
              static int nextId(Context c) {
                  int n=prefs(c).getInt("next",1);
                  prefs(c).edit().putInt("next",n+1).apply();
                  return n;
              }
              static String fa(String s) {
                  StringBuilder b=new StringBuilder();
                  for(char c:s.toCharArray())
                      b.append(c>='0'&&c<='9'?(char)('۰'+c-'0'):c);
                  return b.toString();
              }
              static String money(long n) {
                  return fa(String.format(Locale.US,"%,d",n));
              }
              static String[] months={"فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"};
              static int[] g2j(int gy,int gm,int gd) {
                  int[] gdm={0,31,59,90,120,151,181,212,243,273,304,334};
                  int gy2=gm>2?gy+1:gy;
                  int days=355666+365*gy+(gy2+3)/4-(gy2+99)/100+(gy2+399)/400+gd+gdm[gm-1];
                  int jy=-1595+33*(days/12053);
                  days%=12053;
                  jy+=4*(days/1461);
                  days%=1461;
                  if(days>365){jy+=(days-1)/365;days=(days-1)%365;}
                  int jm=days<186?1+days/31:7+(days-186)/30;
                  int jd=1+(days<186?days%31:(days-186)%30);
                  return new int[]{jy,jm,jd};
              }
              static int[] j2g(int jy,int jm,int jd) {
                  jy+=1595;
                  int days=-355668+365*jy+(jy/33)*8+((jy%33)+3)/4+jd
                      +(jm<7?(jm-1)*31:(jm-7)*30+186);
                  int gy=400*(days/146097);
                  days%=146097;
                  if(days>36524){
                      gy+=100*(--days/36524);
                      days%=36524;
                      if(days>=365)days++;
                  }
                  gy+=4*(days/1461);
                  days%=1461;
                  if(days>365){gy+=(days-1)/365;days=(days-1)%365;}
                  int gd=days+1;
                  int[] sa={0,31,((gy%4==0&&gy%100!=0)||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31};
                  int gm=0;
                  while(gm<13&&gd>sa[gm]){gd-=sa[gm];gm++;}
                  return new int[]{gy,gm,gd};
              }
              static int jlen(int y,int m) {
                  if(m<=6)return 31;
                  if(m<=11)return 30;
                  int[] g=j2g(y,12,30),j=g2j(g[0],g[1],g[2]);
                  return j[0]==y&&j[1]==12&&j[2]==30?30:29;
              }
              static int[] today() {
                  Calendar c=Calendar.getInstance();
                  return g2j(c.get(Calendar.YEAR),c.get(Calendar.MONTH)+1,c.get(Calendar.DAY_OF_MONTH));
              }
              static String key(int y,int m){return y+"-"+m;}
              static int[] nextDue(Bill b) {
                  int[] n=today();
                  int y=n[0],m=n[1],d=Math.min(b.day,jlen(y,m));
                  if(d<n[2]|| (d==n[2]&&b.paidKey.equals(key(y,m)))){
                      m++;
                      if(m>12){m=1;y++;}
                  }
                  return new int[]{y,m,Math.min(b.day,jlen(y,m))};
              }
              static String date(int[] d) {
                  return fa(""+d[2])+" "+months[d[1]-1]+" "+fa(""+d[0]);
              }
              static long when(int[] d,int subtractDays) {
                  int[] g=j2g(d[0],d[1],d[2]);
                  Calendar c=Calendar.getInstance();
                  c.set(g[0],g[1]-1,g[2],9,0,0);
                  c.set(Calendar.MILLISECOND,0);
                  c.add(Calendar.DAY_OF_MONTH,-subtractDays);
                  return c.getTimeInMillis();
              }
              static PendingIntent pending(Context c,Bill b,int y,int m,String msg) {
                  Intent i=new Intent(c,AlarmReceiver.class);
                  i.putExtra("id",b.id);
                  i.putExtra("message",msg);
                  return PendingIntent.getBroadcast(c,b.id*10000+y*12+m,i,
                      PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
              }
              static void scheduleAll(Context c) {
                  AlarmManager am=(AlarmManager)c.getSystemService(Context.ALARM_SERVICE);
                  for(Bill b:load(c)) {
                      int[] due=nextDue(b);
                      long at=when(due,1);
                      String msg="یادت نره؛ فردا موعد پرداخت "+b.title+
                          " به مبلغ "+money(b.amount)+" تومان است.";
                      if(at<=System.currentTimeMillis()){
                          at=when(due,0);
                          msg="یادت نره؛ امروز موعد پرداخت "+b.title+
                              " به مبلغ "+money(b.amount)+" تومان است.";
                      }
                      if(at<=System.currentTimeMillis())continue;
                      PendingIntent p=pending(c,b,due[0],due[1],msg);
                      try { am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,at,p); }
                      catch(Exception e) { am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP,at,p); }
                  }
              }
              static void notifyUser(Context c,int id,String msg) {
                  if(msg==null)msg="موعد پرداخت قسط رسیده است.";
                  NotificationManager nm=(NotificationManager)c.getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(CHANNEL,"یادآوری قسط‌ها",NotificationManager.IMPORTANCE_HIGH));
                  Intent open=new Intent(c,MainActivity.class);
                  PendingIntent pi=PendingIntent.getActivity(c,0,open,
                      PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
                  Notification n=new Notification.Builder(c,CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("قسط‌یار")
                      .setContentText(msg)
                      .setStyle(new Notification.BigTextStyle().bigText(msg))
                      .setContentIntent(pi).setAutoCancel(true).build();
                  nm.notify(id,n);
              }
          }
          GHEOF
          cat > ghestyar/app/src/main/java/com/ghestyar/app/MainActivity.java <<'GHEOF'
          package com.ghestyar.app;
          import android.app.*;
          import android.os.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.text.InputType;
          import android.view.*;
          import android.widget.*;
          import java.util.*;
          import com.ghestyar.app.Core.Bill;

          public class MainActivity extends Activity {
              LinearLayout root;
              int blue=0xFF1565C0,green=0xFF2E7D32,red=0xFFC62828,gray=0xFF546E7A;
              int dp(int x){return (int)(x*getResources().getDisplayMetrics().density);}
              void toast(String s){Toast.makeText(this,s,Toast.LENGTH_LONG).show();}
              @Override public void onCreate(Bundle b){
                  super.onCreate(b);
                  if(Build.VERSION.SDK_INT>=33&&checkSelfPermission("android.permission.POST_NOTIFICATIONS")!=PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"},1);
                  ScrollView sv=new ScrollView(this);
                  sv.setBackgroundColor(0xFFF3F6FA);
                  sv.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  root=new LinearLayout(this);
                  root.setOrientation(1);
                  root.setPadding(dp(16),dp(24),dp(16),dp(24));
                  sv.addView(root);
                  setContentView(sv);
              }
              @Override protected void onResume(){super.onResume();Core.scheduleAll(this);refresh();}
              TextView text(String s,int size,int color,boolean bold){
                  TextView t=new TextView(this);t.setText(s);t.setTextSize(size);t.setTextColor(color);
                  if(bold)t.setTypeface(null,Typeface.BOLD);
                  t.setPadding(0,dp(3),0,dp(3));return t;
              }
              LinearLayout card(){
                  LinearLayout c=new LinearLayout(this);c.setOrientation(1);
                  c.setPadding(dp(14),dp(12),dp(14),dp(12));
                  GradientDrawable g=new GradientDrawable();g.setColor(Color.WHITE);g.setCornerRadius(dp(14));c.setBackground(g);
                  LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);
                  p.setMargins(0,dp(7),0,dp(7));c.setLayoutParams(p);return c;
              }
              Button button(String s,int color,Runnable action){
                  Button b=new Button(this);b.setText(s);b.setTextColor(-1);b.setAllCaps(false);
                  GradientDrawable g=new GradientDrawable();g.setColor(color);g.setCornerRadius(dp(9));b.setBackground(g);
                  b.setOnClickListener(v->action.run());return b;
              }
              EditText edit(String hint,boolean numeric){
                  EditText e=new EditText(this);e.setHint(hint);e.setSingleLine(true);
                  e.setInputType(numeric?InputType.TYPE_CLASS_NUMBER:InputType.TYPE_CLASS_TEXT);return e;
              }
              void refresh(){
                  root.removeAllViews();
                  root.addView(text("قسط‌یار",28,blue,true));
                  root.addView(text("یادآوری ساده قسط‌های ماهانه",15,gray,false));
                  Button add=button("+ افزودن قسط",green,()->form(null));
                  LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(-1,dp(50));
                  bp.setMargins(0,dp(12),0,dp(8));add.setLayoutParams(bp);root.addView(add);
                  List<Bill> bills=Core.load(this);
                  if(bills.isEmpty()){
                      root.addView(text("هنوز قسطی ثبت نکردی.\nعنوان، مبلغ و روز ماه رو وارد کن تا یک روز قبل یادت بندازم.",16,gray,false));
                      return;
                  }
                  for(Bill b:bills){
                      LinearLayout c=card();
                      c.addView(text(b.title,19,Color.BLACK,true));
                      c.addView(text("مبلغ: "+Core.money(b.amount)+" تومان",15,gray,false));
                      c.addView(text("موعد ماهانه: روز "+Core.fa(""+b.day),14,gray,false));
                      int[] now=Core.today();
                      if(b.paidKey.equals(Core.key(now[0],now[1])))
                          c.addView(text("✓ قسط این ماه پرداخت شده",15,green,true));
                      else c.addView(text("قسط این ماه هنوز ثبت نشده",14,0xFFEF6C00,false));
                      LinearLayout row=new LinearLayout(this);row.setOrientation(0);
                      Button paid=button("پرداخت کردم",green,()->pay(b));
                      Button edit=button("ویرایش",blue,()->form(b));
                      Button del=button("حذف",red,()->delete(b));
                      row.addView(paid,new LinearLayout.LayoutParams(0,dp(46),1));
                      row.addView(edit,new LinearLayout.LayoutParams(0,dp(46),1));
                      row.addView(del,new LinearLayout.LayoutParams(0,dp(46),1));
                      c.addView(row);
                      if(b.history.length()>0){
                          c.addView(text("سابقه پرداخت‌ها",14,gray,true));
                          for(int i=b.history.length()-1;i>=0;i--)
                              c.addView(text("• "+b.history.optString(i),13,gray,false));
                      }
                      root.addView(c);
                  }
              }
              void form(Bill existing){
                  boolean add=existing==null;
                  LinearLayout f=new LinearLayout(this);f.setOrientation(1);
                  f.setPadding(dp(12),0,dp(12),0);
                  EditText title=edit("عنوان قسط؛ مثلاً قسط گوشی",false);
                  EditText amount=edit("مبلغ به تومان",true);
                  EditText day=edit("روز پرداخت در ماه (۱ تا ۳۱)",true);
                  if(!add){title.setText(existing.title);amount.setText(""+existing.amount);day.setText(""+existing.day);}
                  f.addView(title);f.addView(amount);f.addView(day);
                  AlertDialog dialog=new AlertDialog.Builder(this)
                      .setTitle(add?"قسط جدید":"ویرایش قسط").setView(f)
                      .setPositiveButton("ذخیره",null).setNegativeButton("انصراف",null).create();
                  dialog.show();
                  dialog.getButton(-1).setOnClickListener(v->{
                      String t=title.getText().toString().trim();
                      long a;int d;
                      try{a=Long.parseLong(amount.getText().toString().trim());d=Integer.parseInt(day.getText().toString().trim());}
                      catch(Exception e){toast("مبلغ و روز را درست وارد کن");return;}
                      if(t.isEmpty()||a<1||d<1||d>31){toast("عنوان، مبلغ و روز ۱ تا ۳۱ را وارد کن");return;}
                      List<Bill> all=Core.load(this);
                      Bill b=existing;
                      if(add){b=new Bill();b.id=Core.nextId(this);all.add(b);}
                      else for(Bill x:all)if(x.id==existing.id)b=x;
                      b.title=t;b.amount=a;b.day=d;
                      Core.save(this,all);dialog.dismiss();refresh();
                  });
              }
              void pay(Bill bill){
                  new AlertDialog.Builder(this)
                      .setMessage("پرداخت قسط «"+bill.title+"» برای این ماه ثبت شود؟")
                      .setPositiveButton("ثبت پرداخت",(d,w)->{
                          List<Bill> all=Core.load(this);
                          for(Bill b:all)if(b.id==bill.id){
                              int[] now=Core.today();String key=Core.key(now[0],now[1]);
                              if(!b.paidKey.equals(key)){
                                  b.paidKey=key;
                                  b.history.put(Core.date(now)+" — "+Core.money(b.amount)+" تومان — "+b.title);
                              }
                          }
                          Core.save(this,all);refresh();toast("پرداخت ثبت شد ✓");
                      }).setNegativeButton("انصراف",null).show();
              }
              void delete(Bill bill){
                  new AlertDialog.Builder(this).setMessage("این قسط و سابقه‌اش حذف شود؟")
                      .setPositiveButton("حذف",(d,w)->{
                          List<Bill> all=Core.load(this);
                          all.removeIf(b->b.id==bill.id);
                          Core.save(this,all);refresh();
                      }).setNegativeButton("انصراف",null).show();
              }
          }
          GHEOF
          cat > ghestyar/build.gradle <<'GHEOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          GHEOF
          cat > ghestyar/gradle.properties <<'GHEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          GHEOF
          cat > ghestyar/settings.gradle <<'GHEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Ghestyar'
          include ':app'
          GHEOF
      - name: Build APK
        working-directory: ghestyar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ghestyar-APK
          path: ghestyar/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp ghestyar/app/build/outputs/apk/debug/app-debug.apk Ghestyar.apk
          gh release create "v${{ github.run_number }}" Ghestyar.apk --title "Ghestyar v${{ github.run_number }}" --notes "Simple monthly payment reminder"
